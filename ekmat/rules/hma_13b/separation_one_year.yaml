id: hma13b.separation_one_year
citation: Hindu Marriage Act 1955, s.13B(1)
verified: true
summary: one year of living separately immediately before the first motion
period: {months: 12}
messages:
  short_with_application:
    on_fail: flag_waivable
    text: Separation began {separation}; the first motion is dated {first_motion}. One year of separation is reached on {reached}, after the first motion. An application under the proviso to s.14(1) is on file and pleads exceptional hardship or exceptional depravity.
  short_application_without_ground:
    on_fail: flag_waivable
    text: Separation began {separation}; the first motion is dated {first_motion}. One year of separation is reached on {reached}, after the first motion. An application under the proviso to s.14(1) is on file, but it does not plead exceptional hardship or exceptional depravity, which the proviso requires.
  short_without_application:
    on_fail: flag_waivable
    text: Separation began {separation}; the first motion is dated {first_motion}. One year of separation is reached on {reached}, after the first motion. No application under the proviso to s.14(1) is on file.
