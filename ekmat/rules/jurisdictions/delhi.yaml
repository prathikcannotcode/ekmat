jurisdiction: delhi
overrides:
  hma13b.separation_one_year:
    waiver_route: Proviso to s.14(1) HMA, per Shiksha Kumari v. Santosh Kumar, MAT.APP.(F.C.) 111/2025, Delhi High Court (Full Bench), 17 December 2025, para 57.1
    verified: true
    note: Checked against the court's text of the judgment, paras 41-44, 49 and 57, on 22 November 2026. Reported as 2025:DHC:11467-FB; that neutral citation is not printed in the court's text file.
local_position: >-
  Shiksha Kumari v. Santosh Kumar (Delhi High Court, Full Bench, 17 December 2025) held that the
  one-year separation in s.13B(1) can be waived by applying the proviso to s.14(1) (para 57.1).
  The waiver is not granted for the asking: the court must be satisfied that there is exceptional
  hardship to the petitioner or exceptional depravity on the part of the respondent, and must test
  the case on the considerations in Pooja Gupta (para 57.4). Those include the spouses' maturity,
  absence of coercion or undue influence, the length of the marriage, no possibility of
  reconciliation, and no misrepresentation or concealment (para 18). The one-year and six-month
  waivers are considered independently, and waiving one does not rule out the other (para 57.2).
  Both the Family Court and the High Court have the power to waive (para 57.5). If the waiver was
  obtained by misrepresentation or concealment, the court may defer the date the decree takes
  effect, or end the petition without prejudice to a fresh one after the year (para 57.6).
local_position_verified: true
