authority: Amardeep Singh v. Harveen Kaur, (2017) 8 SCC 746
conditions:
  a:
    text: The six months in s.13B(2), on top of the one year in s.13B(1), of separation had already passed when the first motion was filed.
    for_the_court: The dates settle this condition. Whether to waive remains the court's discretion.
  b:
    text: All efforts at mediation or conciliation to reunite the parties have failed, and there is no likelihood of success.
    for_the_court: Whether reconciliation is impossible is for the court, on the mediator's report and the hearing.
  c:
    text: The parties have genuinely settled their differences, including alimony, custody of any child and every other pending issue.
    for_the_court: Whether the settlement is genuine and fair, and whether consent is free, is for the court. Ekmat only lists which terms are on file.
  d:
    text: Waiting out the period would only prolong their agony.
    for_the_court: Ekmat makes no assessment of hardship. The facts listed here are for the court to weigh.
