[project]
name = "ekmat"
version = "0.1.0"
description = "Makes an Indian mutual consent divorce file decree-ready at filing and leaves every decision to a person."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ekmat = "ekmat.cli:main"

[build-system]
requires = ["setuptools>=77"]  # 77+ reads the SPDX licence string above
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ekmat*"]

[tool.setuptools.package-data]
ekmat = ["rules/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
